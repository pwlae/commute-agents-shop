name: shop

# Practice shop. Ports on the host: 8080 (gateway),
# 3000 (Grafana), 9090 (Prometheus). Everything else is
# reachable only inside the compose network.

x-health: &health
  interval: 5s
  timeout: 5s
  retries: 20

services:
  # ---------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.2
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      timeout: 20s
      start_period: 10s
    mem_limit: 640m

  # One-shot job: creates the topics, then exits 0.
  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    restart: "no"
    healthcheck:
      disable: true
    mem_limit: 256m

  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -lqt | grep -qw inventory"]
    mem_limit: 256m

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
    mem_limit: 256m

  grafana:
    image: grafana/grafana:13.2.6
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # No plugin downloads at start: works offline, same every run.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      start_period: 10s
    mem_limit: 384m

  # ---------------------------------------------------------
  # Services
  # ---------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      ORDERS_URL: http://orders:3001
      API_KEYS: dev-key
    ports:
      - "8080:8080"
    depends_on:
      orders:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
    mem_limit: 96m

  # orders:         TypeScript, :3001, owns the saga
  # payments:       Python, :8000
  # card-provider:  Python (fake), :8100
  # inventory:      Go, :8200
  # gateway:        TypeScript, :8080 (on the host too)

  inventory:
    build:
      context: .
      dockerfile: inventory/Dockerfile
      args:
        BAD_SKU_CASE: ${BAD_SKU_CASE:-0}
    environment:
      PORT: "8200"
      DATABASE_URL: postgres://inventory:inventory@postgres:5432/inventory?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *health
      test: ["CMD", "inventory", "healthcheck"]
    restart: unless-stopped
    mem_limit: 64m

  payments:
    build:
      context: .
      dockerfile: payments/Dockerfile
    environment:
      DATABASE_URL: postgresql://payments:payments@postgres:5432/payments
      CARD_PROVIDER_URL: http://card-provider:8100
      ORDERS_URL: http://orders:3001
      RECONCILE_EVERY_S: "15"
    depends_on:
      postgres:
        condition: service_healthy
      card-provider:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      start_period: 10s
    mem_limit: 128m

  card-provider:
    build:
      context: .
      dockerfile: card-provider/Dockerfile
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz', timeout=3)"]
    mem_limit: 96m

  orders-migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./orders/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://orders:orders@postgres:5432/orders?sslmode=disable
      - up
    restart: "no"
    mem_limit: 64m

  orders:
    build:
      context: .
      dockerfile: orders/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      orders-migrate:
        condition: service_completed_successfully
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders
      KAFKA_BROKERS: kafka:9092
      PAYMENTS_URL: http://payments:8000
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3001/healthz"]
    restart: unless-stopped
    mem_limit: 128m

  # ---------------------------------------------------------
  # Traffic generator: docker compose --profile traffic up -d
  # ---------------------------------------------------------
  traffic:
    build:
      context: .
      dockerfile: traffic/Dockerfile
    profiles: ["traffic"]
    environment:
      GATEWAY_URL: http://gateway:8080
      API_KEY: dev-key
      ORDERS_PER_S: "0.5"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 48m

volumes:
  pgdata:
