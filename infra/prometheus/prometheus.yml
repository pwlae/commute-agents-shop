global:
  scrape_interval: 15s
  evaluation_interval: 15s

# rule_files:
#   - /etc/prometheus/alerts.yml   # added with the alerts

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Service targets (gateway, orders, payments, inventory,
  # card-provider) are added when the services exist.

  - job_name: orders
    static_configs:
      - targets: ["orders:3001"]
