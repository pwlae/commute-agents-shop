global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: inventory
    static_configs:
      - targets: ["inventory:8200"]

  - job_name: payments
    static_configs:
      - targets: ["payments:8000"]

  - job_name: card-provider
    static_configs:
      - targets: ["card-provider:8100"]

  - job_name: orders
    static_configs:
      - targets: ["orders:3001"]

  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
